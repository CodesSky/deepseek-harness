[package]
name = "deepseek-harness-shell"
version = "0.1.0"
description = "macOS arm64 desktop shell for DeepSeek Harness (WKWebView + local dsh web)"
authors = ["DeepSeek"]
edition = "2021"
rust-version = "1.77"
publish = false

[lib]
name = "deepseek_harness_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "DeepSeekHarness"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true
