[package]
name = "deepseek-harness-shell"
version = "0.1.0"
description = "macOS arm64 desktop shell for DeepSeek Harness (WKWebView + local dsh web)"
authors = ["DeepSeek"]
edition = "2021"
rust-version = "1.77"
publish = false

[lib]
name = "deepseek_harness_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "DeepSeekHarness"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `custom-protocol` clears Tauri's `cfg(dev)`. Without it, even `cargo build --release`
# embeds `app_icon` and calls `NSApplication.setApplicationIconImage` on Ready, which
# paints the Dock tile from a square PNG/ICNS and skips the system squircle mask.
# ([Agent Note](../../../../.agents/notes/implemented/bug-fix/2026-08-14-macos-dock-running-tile-custom-protocol.md))
tauri = { version = "2", features = ["custom-protocol"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true
